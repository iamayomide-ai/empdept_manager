{% extends "base.html" %}
{% block title %}{{ 'Edit' if department else 'New' }} Department{% endblock %}
{% block content %}
<h2 class="mb-4">{{ 'Edit' if department else 'New' }} Department</h2>
<div class="card card-stat p-4" style="max-width: 500px;">
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" name="name" value="{{ department.name if department else '' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Location</label>
            <input type="text" class="form-control" name="location" value="{{ department.location if department else '' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Budget (₦)</label>
            <input type="number" step="0.01" class="form-control" name="budget" value="{{ department.budget if department else '' }}" required>
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{{ url_for('list_departments') }}" class="btn btn-link">Cancel</a>
    </form>
</div>
{% endblock %}
