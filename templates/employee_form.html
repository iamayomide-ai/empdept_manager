{% extends "base.html" %}
{% block title %}{{ 'Edit' if employee else 'New' }} Employee{% endblock %}
{% block content %}
<h2 class="mb-4">{{ 'Edit' if employee else 'New' }} Employee</h2>
<div class="card card-stat p-4" style="max-width: 600px;">
    <form method="POST">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">First Name</label>
                <input type="text" class="form-control" name="first_name" value="{{ employee._first_name if employee else '' }}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Last Name</label>
                <input type="text" class="form-control" name="last_name" value="{{ employee._last_name if employee else '' }}" required>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" value="{{ employee.email if employee else '' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" class="form-control" name="phone" value="{{ employee.phone if employee else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Position</label>
            <input type="text" class="form-control" name="position" value="{{ employee.position if employee else '' }}" required>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Salary (₦)</label>
                <input type="number" step="0.01" class="form-control" name="salary" value="{{ employee.salary if employee else '' }}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Hire Date</label>
                <input type="date" class="form-control" name="hire_date" value="{{ employee.hire_date if employee else '' }}" required>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Department</label>
            <select class="form-select" name="department_id" required>
                {% for d in departments %}
                    <option value="{{ d.department_id }}" {% if employee and employee.department_id == d.department_id %}selected{% endif %}>{{ d.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Role Type</label>
            <select class="form-select" name="role_type" id="roleType" onchange="document.getElementById('teamSizeWrap').style.display = this.value === 'manager' ? 'block' : 'none';">
                <option value="staff" {% if employee and employee.role_type == 'staff' %}selected{% endif %}>Staff</option>
                <option value="manager" {% if employee and employee.role_type == 'manager' %}selected{% endif %}>Manager</option>
            </select>
        </div>
        <div class="mb-3" id="teamSizeWrap" style="display: {{ 'block' if employee and employee.role_type == 'manager' else 'none' }};">
            <label class="form-label">Team Size (if Manager)</label>
            <input type="number" class="form-control" name="team_size" value="{{ employee.team_size if employee and employee.role_type == 'manager' else 0 }}">
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{{ url_for('list_employees') }}" class="btn btn-link">Cancel</a>
    </form>
</div>
{% endblock %}
